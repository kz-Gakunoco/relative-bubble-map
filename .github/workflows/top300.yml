name: Update Top 300
on:
  schedule:
    - cron: '50 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bubble-map-top300
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Update top 300 data
        id: market_update
        run: python update_top300.py
      - name: Save data and run status
        if: ${{ always() && (steps.market_update.outcome == 'success' || steps.market_update.outcome == 'failure') }}
        run: |
          cat data/top300/status.json >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/top300
          for f in config/universe_top300.csv config/top300_membership.json docs/snapshot_top300.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m 'chore: refresh top 300 market data'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

