name: Backfill 3Y History

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download 3 years from Yahoo Finance
        run: python backfill_3y.py

      - name: Rebuild dashboard snapshot
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python update.py

      - name: Commit backfilled data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/snapshot.json
          git diff --cached --quiet || git commit -m "chore: backfill 3y market history"
          git push
