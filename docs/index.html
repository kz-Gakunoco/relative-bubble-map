<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Relative Bubble Map</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root{--bg:#171c24;--panel:#222936;--panel2:#2d3544;--line:#3b4658;--text:#e8edf5;--muted:#9da9ba;--accent:#4aa8ff}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans JP",system-ui,sans-serif}
.header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:#1f2631}
.title{font-weight:700;letter-spacing:.02em}.status{font-size:12px;color:var(--muted)}
.shell{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 52px)}
.sidebar{padding:16px;border-right:1px solid var(--line);background:#202733}
.group{margin-bottom:16px}.label{font-size:11px;color:var(--muted);margin:0 0 6px}.control{width:100%;background:#343d4d;color:var(--text);border:1px solid #4a566a;border-radius:4px;padding:10px;font-weight:600}
.check{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:13px}.hint{font-size:11px;color:var(--muted);line-height:1.55;margin-top:18px}
.main{position:relative;min-width:0}.chart{width:100%;height:calc(100vh - 88px)}
.footer{height:36px;padding:8px 18px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
.badge{display:inline-block;padding:2px 7px;border:1px solid var(--line);border-radius:999px;margin-left:7px}
.mode-note{display:block;margin-top:8px;color:#c0c9d6;font-size:10px;line-height:1.45}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.group{margin:0}.chart{height:70vh}}
</style>
</head>
<body>
<div class="header"><div class="title">Relative Bubble Map</div><div id="status" class="status">読み込み中...</div></div>
<div class="shell">
<aside class="sidebar">
  <div class="group"><div class="label">Y軸</div><select id="metric" class="control"><option value="ret">変動率</option><option value="excess">ベンチマーク超過リターン</option></select></div>
  <div class="group"><div class="label">期間</div><select id="period" class="control"><option>1D</option><option>5D</option><option selected>20D</option><option>60D</option><option>3M</option><option>6M</option><option>12M</option><option>YTD</option></select></div>
  <div class="group"><div class="label">バブルサイズ</div><select id="size" class="control"><option value="market_cap">時価総額</option><option value="equal">均一</option></select></div>
  <div class="group"><div class="label">バブルカラー</div><select id="color" class="control"><option value="sector">セクター</option><option value="performance">パフォーマンス</option></select></div>
  <div class="group"><label class="check"><input id="labels" type="checkbox" checked> ティッカー表示</label><label class="check"><input id="bench" type="checkbox"> 比較ETFをラベルに表示</label></div>
  <div class="hint">バブルをクリックするとTradingViewを開きます。<br>セクターは横方向、Y軸は選択した期間の値です。超過リターンは各銘柄に設定された比較ETFとの差です。<span class="mode-note">時価総額表示は「面積」に比例。最大バブル径は中間サイズに調整し、端の銘柄が欠けないよう表示範囲にも余白を持たせています。</span></div>
</aside>
<main class="main"><div id="chart" class="chart"></div><div class="footer">データが更新できなかった場合も前回の正常データを維持します。</div></main>
</div>
<script>
const sectorOrder=['情報技術','コミュニケーション・サービス','一般消費財','生活必需品','金融','ヘルスケア','資本財・産業','エネルギー','素材','公益','不動産'];
const sectorColors={'情報技術':'#8b6ce6','コミュニケーション・サービス':'#25b3a7','一般消費財':'#e09a2b','生活必需品':'#ca8bf2','金融':'#9dbb28','ヘルスケア':'#e15b87','資本財・産業':'#2aa4b3','エネルギー':'#18a55b','素材':'#d9ac3a','公益':'#6da17d','不動産':'#b679d0'};
let SNAP=null;
function pct(v){return v==null?'—':(v*100).toFixed(2)+'%'}
function money(v){if(v==null||!isFinite(v))return '—'; if(v>=1e12)return '$'+(v/1e12).toFixed(2)+'T'; if(v>=1e9)return '$'+(v/1e9).toFixed(1)+'B'; return '$'+Math.round(v/1e6)+'M'}

// Sector widths expand with the number of registered names, so dense sectors
// such as Technology get more horizontal room than 3-name sectors.
function buildSectorGeometry(bySec){
  const gap=0.42, geom={}, ticks=[], tickText=[], boundaries=[];
  let cursor=0;
  sectorOrder.forEach((s,idx)=>{
    const n=Math.max(1,(bySec[s]||[]).length);
    const width=Math.max(1.35,0.90+n*0.36);
    const left=cursor, right=cursor+width, center=(left+right)/2;
    geom[s]={left,right,center,width};
    ticks.push(center); tickText.push(s);
    if(idx>0) boundaries.push(left-gap/2);
    cursor=right+gap;
  });
  // Extra horizontal padding prevents edge bubbles from being clipped.
  return {geom,ticks,tickText,boundaries,min:-1.05,max:Math.max(1,cursor-gap+1.05)};
}

// Assign points to a small set of horizontal lanes. We sort by performance
// first, which reduces direct overlaps among names with similar Y values.
function laneX(arr,g,key){
  const valid=arr.filter(r=>r[key]!=null).slice().sort((a,b)=>a[key]-b[key]);
  const lanes=Math.max(2,Math.min(6,Math.ceil(Math.sqrt(valid.length*1.8))));
  const lanePos=[];
  for(let j=0;j<lanes;j++){
    lanePos.push(g.left+g.width*((j+0.5)/lanes));
  }
  const map=new Map();
  valid.forEach((r,i)=>{
    // alternate lane direction by row for a slightly more organic packing
    const block=Math.floor(i/lanes);
    const lane=i%lanes;
    const laneIndex=(block%2===0)?lane:(lanes-1-lane);
    map.set(r.ticker,lanePos[laneIndex]);
  });
  return map;
}

function yRange(values){
  if(!values.length)return [-5,5];
  let lo=Math.min(...values), hi=Math.max(...values);
  lo=Math.min(lo,0); hi=Math.max(hi,0);
  let span=Math.max(hi-lo,2.0);
  const pad=Math.max(1.0,span*0.14);
  lo-=pad; hi+=pad;
  // Keep tick labels reasonably clean.
  return [Math.floor(lo*2)/2,Math.ceil(hi*2)/2];
}

function render(){
 const metric=document.getElementById('metric').value,
       period=document.getElementById('period').value,
       sizeMode=document.getElementById('size').value,
       colorMode=document.getElementById('color').value;
 const showLabels=document.getElementById('labels').checked,
       showBench=document.getElementById('bench').checked;
 const key=(metric==='ret'?'ret_':'excess_')+period;

 const bySec={}; sectorOrder.forEach(s=>bySec[s]=[]);
 SNAP.records.forEach(r=>{if(bySec[r.sector])bySec[r.sector].push(r)});
 const geo=buildSectorGeometry(bySec);

 const x=[],y=[],text=[],textpos=[],hover=[],marketCaps=[],colors=[],custom=[];
 sectorOrder.forEach(s=>{
   const arr=bySec[s]||[];
   const xMap=laneX(arr,geo.geom[s],key);
   arr.forEach((r,i)=>{
     const v=r[key];
     if(v==null)return;
     x.push(xMap.get(r.ticker) ?? geo.geom[s].center);
     y.push(v*100);
     text.push(showLabels?r.ticker:'');
     const bench=showBench?`<br>比較ETF: ${r.benchmark}`:'';
     hover.push(
       `<b>${r.ticker}</b> ${r.company}`+
       `<br>${r.sector} / ${r.theme}${bench}`+
       `<br>終値: $${r.last_close.toFixed(2)}`+
       `<br>${metric==='ret'?'変動率':'超過リターン'} (${period}): ${pct(v)}`+
       `<br>時価総額: ${money(r.market_cap)}`+
       `<br>市場日: ${r.last_date}`
     );
     marketCaps.push(Math.max(1,(r.market_cap||5e9)/1e9)); // USD bn
     colors.push(
       colorMode==='sector'
        ? sectorColors[s]
        : (v>=0
            ? `rgba(61,184,127,${Math.min(.92,.58+Math.abs(v)*2.5)})`
            : `rgba(223,82,105,${Math.min(.92,.58+Math.abs(v)*2.5)})`)
     );
     custom.push(r.provider_ticker||r.ticker);
   });
 });

 // Plotly 'area' sizing: max market-cap bubble is capped near 58 px.
 const maxBubblePx=46;
 const maxCap=Math.max(...marketCaps,1);
 const sizeRef=(sizeMode==='market_cap') ? (2*maxCap)/(maxBubblePx*maxBubblePx) : 1;
 const markerSizes=(sizeMode==='equal') ? marketCaps.map(()=>17) : marketCaps;

 // Place labels inside sufficiently large bubbles; smaller names alternate above/below.
 const estimatedDiameter = markerSizes.map(v=>{
   if(sizeMode==='equal') return 18;
   return Math.sqrt((2*v)/sizeRef);
 });
 estimatedDiameter.forEach((d,i)=>{
   if(!showLabels){textpos.push('middle center');return;}
   if(d>=28) textpos.push('middle center');
   else textpos.push(i%2===0?'top center':'bottom center');
 });

 const yr=yRange(y);
 const shapes=[];
 // No vertical sector divider lines: grouping is communicated by spacing + labels.
 // Stronger zero line (especially useful for excess-return mode)
 shapes.push({
   type:'line',xref:'paper',yref:'y',x0:0,x1:1,y0:0,y1:0,
   line:{color:metric==='excess'?'rgba(210,220,233,.75)':'rgba(170,184,202,.52)',width:metric==='excess'?2:1.25}
 });

 const trace={
   type:'scatter',
   mode:showLabels?'markers+text':'markers',
   x,y,text,textposition:textpos,
   textfont:{color:'#c3cbd7',size:9},
   cliponaxis:false,
   hovertext:hover,hoverinfo:'text',customdata:custom,
   marker:{
     size:markerSizes,
     sizemode:sizeMode==='market_cap'?'area':'diameter',
     sizeref:sizeRef,
     sizemin:sizeMode==='market_cap'?6:17,
     color:colors,
     line:{width:1,color:'rgba(255,255,255,.34)'},
     opacity:.78
   }
 };

 const layout={
   paper_bgcolor:'#171c24',
   plot_bgcolor:'#171c24',
   margin:{l:72,r:24,t:22,b:86},
   xaxis:{
     range:[geo.min,geo.max],
     tickmode:'array',tickvals:geo.ticks,ticktext:geo.tickText,
     tickangle:-25,
     tickfont:{size:10,color:'#aeb8c8'},
     showgrid:false,zeroline:false,color:'#aeb8c8',
     fixedrange:false
   },
   yaxis:{
     range:yr,
     title:(metric==='ret'?'変動率 ':'超過リターン ')+period+' (%)',
     titlefont:{size:11,color:'#aeb8c8'},
     gridcolor:'rgba(75,88,106,.42)',
     zeroline:false,
     color:'#aeb8c8',
     tickfont:{size:10},
     ticksuffix:'%'
   },
   shapes,
   showlegend:false,
   hoverlabel:{bgcolor:'#2d3544',bordercolor:'#566277',font:{color:'#fff'}},
   dragmode:'pan'
 };

 Plotly.react('chart',[trace],layout,{
   responsive:true,displaylogo:false,scrollZoom:true,
   modeBarButtonsToRemove:['lasso2d','select2d']
 });

 const unavailable=SNAP.records.filter(r=>r[key]==null).map(r=>r.ticker);
 const warn=unavailable.length?`<span class="badge">データ不足: ${unavailable.join(', ')}</span>`:'';
 document.getElementById('status').innerHTML=
   `市場日: <b>${SNAP.latest_market_date||'—'}</b>`+
   `<span class="badge">登録 ${SNAP.records.length}銘柄</span>`+
   `<span class="badge">表示 ${y.length}銘柄</span>${warn}`;

 const el=document.getElementById('chart');
 el.removeAllListeners && el.removeAllListeners('plotly_click');
 el.on('plotly_click',d=>{
   if(d.points&&d.points[0]){
     window.open('https://www.tradingview.com/chart/?symbol='+encodeURIComponent(d.points[0].customdata),'_blank');
   }
 });
}
async function init(){try{const r=await fetch('snapshot.json?ts='+Date.now());SNAP=await r.json();render()}catch(e){document.getElementById('status').textContent='snapshot.json を読み込めません';console.error(e)}}
['metric','period','size','color','labels','bench'].forEach(id=>document.getElementById(id).addEventListener('change',render));
init();
</script>
</body></html>
